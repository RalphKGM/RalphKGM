# ─────────────────────────────────────────────────────────────
#  AUTOMATIC SECTIONS. Turn on/off and tune.
# ─────────────────────────────────────────────────────────────
[auto]
show_recent_repos = true     # "more public repos" list
recent_repos_count = 6
show_activity = true         # latest public pushes / new repos / releases
activity_count = 6
show_languages = true        # language bar measured from your public repos
languages_count = 7
# Languages that inflate the numbers without being "code you wrote".
ignore_languages = ["Jupyter Notebook", "Makefile", "Batchfile", "CMake", "Dockerfile", "Procfile"]
show_streak = true           # streak card (external service)
show_views = true            # small profile view counter
show_snake = false           # contribution snake (turn on after the snake workflow runs once)
# Public repos to never list in the automatic sections.
exclude_repos = ["RalphKGM", "group4website.github.io", "WD4E-Advanced_Styling_With_Responsive_Design"]
# Keep these out of the activity feed too (still allowed in "more public repos").
quiet_repos = ["rimsekai-ce-compatibility-patch", "rimpy-light"]
